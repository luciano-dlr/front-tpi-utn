
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Carrito de Compras</title>
<link rel="stylesheet" href="../../../style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <h1 class="logo">Food Store</h1>
            <nav class="main-nav">
                <a href="../home/home.html">Catálogo</a>
                <a href="../cart/cart.html" class="active"> Carrito</a>
            </nav>
        </div>
    </header>

    <div class="cart-container">
        <h2>Mi Carrito</h2>
        
        <div id="empty-cart-message" class="empty-cart-message">
            <p> Tu carrito está vacío</p>
            <button onclick="window.location.href='../home/home.html'" class="btn-primary">
                Ver productos
            </button>
        </div>

        <div id="cart-content" class="cart-content" style="display: none;">
            <div id="cart-items-container" class="cart-items"></div>
            
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Total de productos:</span>
                    <span id="total-items">0</span>
                </div>
                <div class="summary-row total">
                    <span>Total a pagar:</span>
                    <span id="cart-total">$0</span>
                </div>
                <div class="cart-actions">
                    <button id="clear-cart-btn" class="btn-secondary">Vaciar carrito</button>
                    <button id="continue-shopping-btn" class="btn-primary">Seguir comprando</button>
                </div>
            </div>

            <div class="checkout-section" id="checkout-section">
                <h3>Confirmar pedido</h3>
                <div id="checkout-error" class="form-error"></div>
                <div class="form-group">
                    <label class="form-label" for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" class="form-input" placeholder="Ingresá tu teléfono" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="forma-pago">Forma de pago</label>
                    <select id="forma-pago" class="form-input" required>
                        <option value="">Seleccioná una forma de pago</option>
                        <option value="TARJETA">Tarjeta</option>
                        <option value="TRANSFERENCIA">Transferencia</option>
                        <option value="EFECTIVO">Efectivo</option>
                    </select>
                </div>
                <button id="btn-confirm" class="btn-confirm">Confirmar pedido</button>
                <div id="success-message" class="success-message" style="display: none;">
                    ¡Pedido confirmado con éxito! Redirigiendo al catálogo...
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./cart.ts"></script>
</body>
</html>
