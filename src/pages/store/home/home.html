
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Catálogo</title>
    <link rel="stylesheet" href="../../../style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <h1 class="logo">Food Store</h1>
            <nav class="main-nav">
                <a href="../home/home.html" class="active">Catálogo</a>
                <a href="../cart/cart.html" class="cart-link">
                    Carrito
                    <span id="cart-count" class="cart-count" style="display: none;">0</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <h2>Categorías</h2>
            <button id="show-all-btn" class="show-all-btn active">Todos los productos</button>
            <ul id="lista-categorias" class="categories-list"></ul>
        </aside>

        <main class="main-content">
            <div class="search-container">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="🔍 Buscar productos por nombre..."
                    class="search-input"
                >
            </div>
            
            <div id="contenedor-productos" class="products-grid"></div>
        </main>
    </div>

    <script type="module" src="./home.ts"></script>
</body>
</html>
