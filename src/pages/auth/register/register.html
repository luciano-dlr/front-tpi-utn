<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Registro</title>
    <link rel="stylesheet" href="../../../style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <h1 class="logo">Food Store</h1>
            <nav class="main-nav">
                <a href="../../store/home/home.html">Catálogo</a>
            </nav>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Crear Cuenta</h2>
            <p class="auth-subtitle">Completá tus datos para registrarte</p>

            <div id="error-message" class="form-error"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-input" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input type="text" id="apellido" class="form-input" placeholder="Tu apellido" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="celular" class="form-label">Celular</label>
                    <input type="tel" id="celular" class="form-input" placeholder="11 1234 5678">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-input" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="Repetí tu contraseña" required>
                </div>

                <button type="submit" class="btn-submit">Crear Cuenta</button>
            </form>

            <div class="auth-links">
                <p>¿Ya tenés cuenta? <a href="../login/login.html">Iniciá sesión</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="./register.ts"></script>
</body>
</html>
